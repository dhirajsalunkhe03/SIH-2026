version: '3.8'

services:
  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: sih-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Legal RAG API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih-legal-rag-api
    ports:
      - "8000:8000"
    volumes:
      - ./vector_db:/app/vector_db:ro
      - ./logs:/app/logs
      - ./output:/app/output
      - ./.env:/app/.env:ro
    environment:
      - RAG_OLLAMA_HOST=http://ollama:11434
      - RAG_API_HOST=0.0.0.0
      - RAG_API_PORT=8000
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Streamlit Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih-legal-rag-frontend
    ports:
      - "8501:8501"
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - RAG_API_HOST=api
      - RAG_API_PORT=8000
    command: streamlit run app.py --server.port 8501 --server.headless true --server.address 0.0.0.0
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  default:
    name: sih-legal-rag-network